services:
  - type: web
    name: cwg-formulario
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /saude
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cwg-formulario-db
          property: connectionString

databases:
  - name: cwg-formulario-db
    plan: free
    databaseName: cwg
    user: cwg_app
